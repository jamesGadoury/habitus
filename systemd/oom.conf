# Installed by habitus as ~/.config/systemd/user.conf.d/habitus-oom.conf.
#
# A unit's OOMPolicy defaults to "stop": when the kernel OOM-kills one process
# in a terminal's or tmux's scope, systemd then stops the whole scope, which
# ends the shell and everything started from it. "continue" lets the kernel's
# victim die alone. It applies to units created after
# `systemctl --user daemon-reexec` or the next login; a running terminal keeps
# its old policy until it is reopened.
[Manager]
DefaultOOMPolicy=continue

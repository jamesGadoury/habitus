# Models for the `llama` wrapper (shell/bin/llama). Source of truth for
# `llama pull` / `llama list` / `llama -m <alias>`.
#
# Format (whitespace-separated, one model per line):
#   alias  hf-repo  gguf-file  [extra llama.cpp args...]
# Files are fetched from https://huggingface.co/<hf-repo>/resolve/main/<gguf-file>
# into ${LLAMA_MODEL_DIR:-${XDG_DATA_HOME:-~/.local/share}/llama/models}.
# {confdir} expands to this directory.
#
# Both models need a custom chat template to keep them from reasoning at
# length (minutes of CPU for "hello"): llama-completion ignores `-rea off`,
# rejects --chat-template-kwargs, and always injects a system message. The
# *-nothink.jinja headers explain each model's trigger. Sampling is each
# vendor's recommended non-thinking preset.
#
# Chosen 2026-09-26 on a 4-core/8-thread AVX2 laptop CPU, 4 threads, llama.cpp b11193.
# Seven practical tasks (shell command, commit message from a diff, doc
# summary, explain, time arithmetic, JSON extraction, code), one run each:
#   model            prompt    generate  7 tasks  correct
#   Gemma 4 E2B QAT  38 tok/s  13.5 tok/s   75s    7/7   <- default
#   Qwen3.5-4B       21 tok/s   6.8 tok/s  197s    7/7   <- smart
#   Phi-4-mini 3.8B  23 tok/s   8.6 tok/s  103s    6/7   (dropped)
#   Qwen3.5-2B       47 tok/s  13.1 tok/s   89s   ~3/7   (dropped)
# 8 threads was ~30% slower than 4 (SMT hurts here).

default  unsloth/gemma-4-E2B-it-qat-GGUF  gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf  --temp 1.0 --top-p 0.95 --top-k 64 --jinja --chat-template-file {confdir}/gemma-nothink.jinja
smart    unsloth/Qwen3.5-4B-GGUF          Qwen3.5-4B-UD-Q4_K_XL.gguf          --temp 0.7 --top-p 0.8 --top-k 20 --min-p 0 --presence-penalty 1.5 --jinja --chat-template-file {confdir}/qwen-nothink.jinja

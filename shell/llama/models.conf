# Models for the `llama` wrapper (shell/bin/llama). Source of truth for
# `llama pull` / `llama list` / `llama -m <alias>`.
#
# Format (whitespace-separated, one model per line):
#   alias  hf-repo  gguf-file  [extra llama.cpp args...]
# Files are fetched from https://huggingface.co/<hf-repo>/resolve/main/<gguf-file>
# into ${LLAMA_MODEL_DIR:-${XDG_DATA_HOME:-~/.local/share}/llama/models}.
#
# Sampling below is Qwen's recommended non-thinking "general tasks" preset.
# Thinking is forced off by qwen-nothink.jinja: with the GGUF's own template,
# llama-completion ignores `-rea off` and the model reasons at length on ~40% of
# prompts (minutes of CPU for "hello"). {confdir} expands to this directory.
#
# Measured on i7-8550U (4C/8T, AVX2), 4 threads, llama.cpp b11193
# (8 threads was ~30% slower on both):
#   default  4B  prompt  21 tok/s  generate  6.8 tok/s  warm one-shot ~4.5s
#   fast     2B  prompt  47 tok/s  generate 13.1 tok/s  warm one-shot ~2.5s
# Prompt processing dominates for large piped input — prefer `-m fast` there.

default  unsloth/Qwen3.5-4B-GGUF    Qwen3.5-4B-UD-Q4_K_XL.gguf    --temp 0.7 --top-p 0.8 --top-k 20 --min-p 0 --presence-penalty 1.5 --jinja --chat-template-file {confdir}/qwen-nothink.jinja
fast     unsloth/Qwen3.5-2B-GGUF    Qwen3.5-2B-UD-Q4_K_XL.gguf    --temp 0.7 --top-p 0.8 --top-k 20 --min-p 0 --presence-penalty 1.5 --jinja --chat-template-file {confdir}/qwen-nothink.jinja
tiny     unsloth/Qwen3.5-0.8B-GGUF  Qwen3.5-0.8B-UD-Q4_K_XL.gguf  --temp 0.7 --top-p 0.8 --top-k 20 --min-p 0 --presence-penalty 1.5 --jinja --chat-template-file {confdir}/qwen-nothink.jinja

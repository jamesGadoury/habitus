# ============================================================================
# tmux configuration
# ============================================================================

# ----------------------------------------------------------------------------
# Prefix
# ----------------------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ----------------------------------------------------------------------------
# General
# ----------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g mouse on

# Index windows/panes from 1 and renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Allow titles to be set by terminal
set -g set-titles on
set -g set-titles-string "#S / #W"

# ----------------------------------------------------------------------------
# Splits and windows (open in current path)
# ----------------------------------------------------------------------------
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ----------------------------------------------------------------------------
# Vim-style pane navigation
# ----------------------------------------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize with repeat (hold prefix briefly, then tap H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window cycling
bind -r n next-window
bind -r p previous-window
bind Tab last-window

# ----------------------------------------------------------------------------
# Copy mode (vi-style)
# ----------------------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Clipboard integration is owned by tmux-yank (see @plugin list below), which
# binds `y` in copy-mode-vi itself and picks the helper at runtime: wl-copy,
# then xsel, then xclip. TPM loads plugins at the bottom of this file, so any
# `bind -T copy-mode-vi y ...` written here is overridden and has no effect.
# Check the live binding with:  tmux list-keys -T copy-mode-vi | grep " y "
# Install the helper for your session type: wl-clipboard (Wayland) or xclip
# (X11) — shell/install.d/70-clipboard.sh warns when it is missing.
#
# Over ssh that helper has no display to talk to, so the copy reaches your
# local clipboard via OSC 52 instead: every copy-pipe also sets a tmux buffer,
# which tmux forwards to the outer terminal. Two settings keep that working
# when tmux is nested (local tmux -> ssh -> remote tmux):
#   - `on` (not the default `external`) lets tmux accept OSC 52 from programs
#     in its panes, e.g. the inner tmux, and pass it on to the terminal.
#   - the inner tmux's client is the outer tmux (TERM=tmux-256color), which the
#     default terminal-features does not mark as clipboard-capable.
set -s set-clipboard on
set -as terminal-features ',tmux*:clipboard'

# ----------------------------------------------------------------------------
# Reload config
# ----------------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ----------------------------------------------------------------------------
# Status bar (minimal)
# ----------------------------------------------------------------------------
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=white"

set -g status-left-length 30
set -g status-left "#[fg=green,bold][#S] "
# Loud zoom indicator: only rendered while the active pane is zoomed
set -g status-right "#{?window_zoomed_flag,#[fg=black#,bg=yellow#,bold] ZOOM #[default] ,}#[fg=cyan]%Y-%m-%d #[fg=yellow]%H:%M "

# Zoom marker on the window name (these formats omit #F, tmux's flag field)
setw -g window-status-current-style "fg=black,bg=cyan,bold"
setw -g window-status-current-format " #I:#W#{?window_zoomed_flag,#[fg=red]Z,} "
setw -g window-status-format " #I:#W#{?window_zoomed_flag,Z,} "

# Pane borders — active border turns yellow while zoomed
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "#{?window_zoomed_flag,fg=yellow,fg=cyan}"

# ----------------------------------------------------------------------------
# Plugins (TPM)
# Install: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# (shell/install.d/60-tmux.sh does this). Missing plugins are then installed
# automatically in the background at startup — see the end of this file;
# prefix + I (capital i) still installs by hand.
# ----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# resurrect/continuum settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

# Install any @plugin not yet cloned, so a new machine does not sit with dead
# bindings until someone remembers prefix + I. install_plugins skips plugins
# already present, so this costs no network once everything is installed. It
# runs in the background, after the tpm line above has already sourced what was
# there, so re-run tpm only when something was actually installed to load it.
# Output is discarded: run-shell would otherwise paint it over the active pane.
run -b 'out=$(~/.tmux/plugins/tpm/bin/install_plugins 2>&1) || exit 0; case "$out" in *Installing*) ~/.tmux/plugins/tpm/tpm >/dev/null 2>&1 ;; esac; exit 0'

# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
#
# lazygit config, symlinked to ~/.config/lazygit/config.yml by
# shell/install.d/55-lazygit.sh. Only settings that differ from lazygit's
# defaults live here; the full reference is docs/Config.md in the lazygit repo
# (read it at the tag the install step pins, since keys get renamed).
#
# Colours are deliberately not set. When lazygit is opened from Neovim
# (snacks.nvim, <Leader>gg), snacks appends its own config file after this one
# with a theme built from the current colorscheme; outside Neovim, lazygit's
# defaults follow the terminal palette.

git:
  # Cycle with `|`. delta is installed by the same step as lazygit and is used
  # only here: plain `git diff` keeps git/config's `pager = cat`.
  # --paging=never is required; delta running its own pager breaks the view.
  # --hyperlinks makes line numbers clickable (opens that line in the editor).
  # The two leading spaces in --line-numbers-left-format are room for the
  # selection bar: since v0.66 lazygit marks the selected hunk in a focused
  # diff with a 2-column bar at the left edge (not configurable), which
  # otherwise covers the start of the line numbers.
  #
  # Line numbers show only when the diff is wider than 120 columns, i.e. in
  # full screen (`+`) on a typical terminal: in the normal layout the diff gets
  # two thirds of the width, and the numbers cost 11 columns of it. lazygit
  # reruns the renderer with the new {{width}} when the screen mode changes.
  # Below the threshold, the line-number columns shrink to the two spaces the
  # bar needs. On a terminal wider than ~180 columns the normal layout
  # crosses 120 too; raise the number if that's yours.
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never --line-numbers {{if gt .width 120}}--line-numbers-left-format="  {nm:^4}⋮" --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"{{else}}--line-numbers-left-format="  " --line-numbers-right-format=""{{end}}
    - name: side-by-side
      command: delta --{{colorScheme}} --paging=never --line-numbers --line-numbers-left-format="  {nm:^4}⋮" --side-by-side
    - type: rawGit
      name: plain git
  # Render :rocket: in commit messages as the emoji.
  parseEmoji: true

os:
  # Inside Neovim this opens files in that session instead of a nested nvim;
  # elsewhere it runs plain nvim. snacks sets the same value when it opens
  # lazygit, so behaviour matches inside and outside the editor.
  editPreset: nvim-remote

update:
  # The install step pins the version; the self-updater would undo that.
  method: never

gui:
  nerdFontsVersion: "3"
  showRandomTip: false
  # "3↓ 1↑" against the base branch in the branches list.
  showDivergenceFromBaseBranch: arrowAndNumber
  # Fuzzy rather than substring matching when filtering a list with `/`.
  filterMode: fuzzy
